name: Inspect public CourseSprout client
on:
  push:
    paths:
      - .github/workflows/inspect-coursesprout.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract public CourseSprout source references
        run: |
          mkdir -p /tmp/coursesprout-src
          cd /tmp/coursesprout-src
          npm pack coursesprout-mcp@0.1.0 --silent > /tmp/cs-tarball
          tar xf "$(cat /tmp/cs-tarball)"
          node - <<'JS'
          const fs=require('fs'),path=require('path');
          const out=[];
          function walk(p){for(const e of fs.readdirSync(p,{withFileTypes:true})){const f=path.join(p,e.name);if(e.isDirectory())walk(f);else if(/\.(js|ts|md)$/.test(f)){const s=fs.readFileSync(f,'utf8');for(const key of ['set_member_access','set-member-access','setMemberAccess']){let x=s.indexOf(key),i=0;while(x>=0&&i++<5){out.push('FILE '+f+' KEY '+key+'\n'+s.slice(Math.max(0,x-500),x+950)+'\n---');x=s.indexOf(key,x+key.length)}}}}}
          walk('package');
          fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/automazioni/coursesprout-route-research.txt',out.join('\n').slice(0,50000)||'No source occurrences found');
          JS
      - name: Commit inspection (public package only)
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add automazioni/coursesprout-route-research.txt
          git commit -m "Extract publicly published CourseSprout access route" || exit 0
          git push
