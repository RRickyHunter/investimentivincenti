name: Verify Frattali paid-test grant
on:
  push:
    paths:
      - .github/workflows/test-frattali-api.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call gated test fulfillment
        shell: bash
        run: |
          for i in 1 2 3; do
            status=$(curl -sS --max-time 35 -o /tmp/report.json -w '%{http_code}' https://www.investimentivincenti.com/api/test-frattali-grant)
            echo "HTTP $status"
            if [[ "$status" == "200" ]]; then break; fi
            sleep 8
          done
          node - <<'JS'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/report.json','utf8'));fs.writeFileSync('automazioni/frattali-live-test-report.json',JSON.stringify(d,null,2)+'\n');
          JS
      - name: Record test outcome
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add automazioni/frattali-live-test-report.json
          git commit -m "Record real CourseSprout staging grant verification" || exit 0
          git push
