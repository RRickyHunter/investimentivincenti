<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t d"><title id="t">Registrazione inclusa</title><desc id="d">La diretta è consigliata ma non obbligatoria: puoi guardare la registrazione dal mattino successivo.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1424"/><stop offset="1" stop-color="#224361"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e8bf81"/><stop offset="1" stop-color="#c58e44"/></linearGradient></defs><rect width="1200" height="440" rx="22" fill="url(#bg)"/><g fill="none" stroke="#4a7896" opacity=".35"><path d="M0 360 Q150 160 300 300 T600 280 T900 170 T1200 120"/><path d="M0 400 Q150 200 300 340 T600 320 T900 210 T1200 160"/><path d="M0 320 Q150 120 300 260 T600 240 T900 130 T1200 80"/></g><g font-family="Georgia,serif"><text x="58" y="102" font-size="48" fill="#fff">Non puoi seguire</text><text x="58" y="162" font-size="48" fill="url(#gold)">la diretta?</text><text x="58" y="222" font-size="30" fill="#e4edf4">La registrazione è inclusa.</text></g><rect x="58" y="263" width="600" height="62" rx="12" fill="none" stroke="#d6a360" stroke-width="2"/><circle cx="90" cy="294" r="17" fill="#d6a360"/><path d="M85 283v22l18-11z" fill="#10253a"/><text x="124" y="305" font-size="23" font-family="Arial,sans-serif" font-weight="600" fill="#f3d3a3">Guardala quando preferisci</text><text x="58" y="373" font-size="20" fill="#c8d9e7" font-family="Arial,sans-serif">Disponibile normalmente dal mattino successivo</text><g transform="translate(840 105)"><rect x="0" y="0" width="270" height="185" rx="20" fill="#101e31" stroke="#77adc4" stroke-width="3"/><rect x="18" y="22" width="234" height="119" rx="8" fill="#1b3e57"/><circle cx="135" cy="79" r="41" fill="#d4a05b"/><path d="M124 56v46l36-23z" fill="#10253a"/><rect x="22" y="154" width="226" height="9" rx="4" fill="#41657b"/><rect x="22" y="154" width="110" height="9" rx="4" fill="#d4a05b"/></g></svg>